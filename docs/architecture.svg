<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1250" width="420" height="1250" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/>
    </marker>
    <style>
      .t { font-size: 15px; font-weight: 700; fill: #1d2433; }
      .b { font-size: 13px; fill: #3a4252; }
      .band { font-size: 11.5px; font-weight: 700; letter-spacing: 0.08em; fill: #ffffff; }
      .lbl { font-size: 11.5px; fill: #5b6475; font-style: italic; }
      .ln { stroke: #5b6475; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect width="420" height="1250" fill="#ffffff"/>

  <text x="14" y="32" style="font-size:20px;font-weight:800;fill:#1d2433">DEXTRA: how the data flows</text>
  <text x="14" y="54" class="b">Sid's design, Sat Nov 7. Everything runs on the laptop.</text>

  <!-- Band: Java -->
  <rect x="14" y="70" width="356" height="24" rx="6" fill="#3b6fd8"/>
  <text x="24" y="86" class="band">JAVA, SPRING BOOT ON THE LAPTOP</text>

  <!-- 1 Webcam -->
  <rect x="14" y="104" width="356" height="50" rx="10" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="26" y="126" class="t">1  Webcam</text>
  <text x="26" y="145" class="b">30 frames a second</text>
  <line x1="192" y1="154" x2="192" y2="168" class="ln" marker-end="url(#arrow)"/>

  <!-- 2 JavaCV -->
  <rect x="14" y="170" width="356" height="50" rx="10" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="26" y="192" class="t">2  JavaCV grabs each frame</text>
  <text x="26" y="211" class="b">Java owns the webcam</text>
  <line x1="192" y1="220" x2="192" y2="234" class="ln" marker-end="url(#arrow)"/>

  <!-- 3 Hand finder -->
  <rect x="14" y="236" width="356" height="104" rx="10" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="26" y="260" class="t">3  Hand finder (OpenCV DNN)</text>
  <text x="26" y="280" class="b">MediaPipe palm finder, then the</text>
  <text x="26" y="298" class="b">21-point hand model (ONNX files)</text>
  <text x="26" y="316" class="b">→ fingertip (point 8): x, y, confidence</text>
  <text x="26" y="334" class="b">Backup by 12:30: a coloured sticker</text>
  <line x1="192" y1="340" x2="192" y2="354" class="ln" marker-end="url(#arrow)"/>

  <!-- 4 Rule gate -->
  <rect x="14" y="356" width="356" height="86" rx="10" fill="#fff6e5" stroke="#d99a1f" stroke-width="1.5"/>
  <text x="26" y="380" class="t">4  Rule gate (plain Java)</text>
  <text x="26" y="400" class="b">Hand lost, low confidence or shaky</text>
  <text x="26" y="418" class="b">tracking → flagged "not sure",</text>
  <text x="26" y="436" class="b">never scored (your line 3)</text>

  <!-- live arrow down -->
  <line x1="192" y1="442" x2="192" y2="472" class="ln" marker-end="url(#arrow)"/>
  <text x="200" y="462" class="lbl">live, about 30 a second, WebSocket</text>

  <!-- recorded bypass on the right -->
  <path d="M370,399 L398,399 L398,771 L374,771" class="ln" marker-end="url(#arrow)"/>
  <text x="410" y="585" class="lbl" transform="rotate(90 410 585)" text-anchor="middle">recorded: points and target hits</text>

  <!-- Band: Live -->
  <rect x="14" y="474" width="356" height="24" rx="6" fill="#2e9b5f"/>
  <text x="24" y="490" class="band">LIVE, EVERY FRAME, IN THE BROWSER</text>

  <!-- 5 Drill -->
  <rect x="14" y="506" width="356" height="68" rx="10" fill="#ecf8f0" stroke="#2e9b5f" stroke-width="1.5"/>
  <text x="26" y="530" class="t">5  Drill page</text>
  <text x="26" y="550" class="b">The dot follows your finger</text>
  <text x="26" y="567" class="b">through the targets</text>
  <line x1="192" y1="574" x2="192" y2="588" class="ln" marker-end="url(#arrow)"/>

  <!-- 6 Robot -->
  <rect x="14" y="590" width="356" height="86" rx="10" fill="#ecf8f0" stroke="#2e9b5f" stroke-width="1.5"/>
  <text x="26" y="614" class="t">6  3D surgical robot (three.js)</text>
  <text x="26" y="634" class="b">Its tool tip follows your finger.</text>
  <text x="26" y="652" class="b">Gauges: distance off the path, speed,</text>
  <text x="26" y="670" class="b">shake. The numbers being scored.</text>

  <!-- Band: After -->
  <rect x="14" y="696" width="356" height="24" rx="6" fill="#3b6fd8"/>
  <text x="24" y="712" class="band">AFTER EACH ATTEMPT, IN JAVA</text>

  <!-- 7 Scorer -->
  <rect x="14" y="728" width="356" height="86" rx="10" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="26" y="752" class="t">7  Scorer (plain Java, unit-tested)</text>
  <text x="26" y="772" class="b">Accuracy, smoothness, speed,</text>
  <text x="26" y="790" class="b">each next to its formula.</text>
  <text x="26" y="808" class="b">Trusted stretches only</text>
  <line x1="192" y1="814" x2="192" y2="828" class="ln" marker-end="url(#arrow)"/>

  <!-- 8 Save -->
  <rect x="14" y="830" width="356" height="104" rx="10" fill="#eef4ff" stroke="#3b6fd8" stroke-width="1.5"/>
  <text x="26" y="854" class="t">8  Save the attempt</text>
  <text x="26" y="874" class="b">Every point: time, x, y, confidence</text>
  <text x="26" y="892" class="b">Targets and hits · the numbers</text>
  <text x="26" y="910" class="b">The refusals (flagged stretches)</text>
  <text x="26" y="928" class="b" style="font-style:italic">Database: still open (Tiger Data?)</text>
  <line x1="192" y1="934" x2="192" y2="948" class="ln" marker-end="url(#arrow)"/>

  <!-- 9 Gemini -->
  <rect x="14" y="950" width="356" height="70" rx="10" fill="#f5eeff" stroke="#8a5cd6" stroke-width="1.5"/>
  <text x="26" y="974" class="t">9  Gemini writes the feedback</text>
  <text x="26" y="994" class="b">From the measured numbers only.</text>
  <text x="26" y="1012" class="b">It never sets the score.</text>
  <line x1="192" y1="1020" x2="192" y2="1034" class="ln" marker-end="url(#arrow)"/>

  <!-- 10 Results -->
  <rect x="14" y="1036" width="356" height="104" rx="10" fill="#ecf8f0" stroke="#2e9b5f" stroke-width="1.5"/>
  <text x="26" y="1060" class="t">10  Results page (browser)</text>
  <text x="26" y="1080" class="b">Your path drawn over the targets</text>
  <text x="26" y="1098" class="b">The numbers and their formulas</text>
  <text x="26" y="1116" class="b">Flagged stretches · the feedback</text>
  <text x="26" y="1134" class="b">Compared with past attempts</text>

  <!-- Open items -->
  <rect x="14" y="1160" width="356" height="72" rx="10" fill="#ffffff" stroke="#8a8f99" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="26" y="1184" class="t" style="fill:#5b6475">Still open</text>
  <text x="26" y="1204" class="b">Who it's for · what line 3 costs</text>
  <text x="26" y="1222" class="b">The database · each sponsor's job</text>
</svg>

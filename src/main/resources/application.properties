spring.application.name=dextra
# Loads GEMINI_API_KEY from .env in the folder you start the app from (skipped if the file isn't there)
spring.config.import=optional:file:.env[.properties]
server.port=8080
dextra.camera.enabled=true
dextra.camera.index=0
dextra.camera.width=640
dextra.camera.height=480
dextra.palm.score-threshold=0.6
dextra.hand.confidence-threshold=0.8

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DEXTRA live check</title>
<style>
  body { margin: 0; background: #0f141b; color: #e8edf3; font: 16px system-ui, sans-serif; }
  header { padding: 12px 16px; display: flex; gap: 16px; align-items: center; }
  #chip { padding: 4px 10px; border-radius: 999px; background: #444; }
  #chip.ok { background: #1f8a4c; } #chip.warn { background: #b7791f; }
  canvas { display: block; margin: 0 auto; background: #18202b; border-radius: 8px; }
</style>
</head>
<body>
<header><strong>DEXTRA live check</strong><span id="chip" aria-live="polite">Connecting</span><span id="info"></span></header>
<canvas id="c" width="640" height="480"></canvas>
<script>
  const c = document.getElementById('c'), g = c.getContext('2d');
  const chip = document.getElementById('chip'), info = document.getElementById('info');
  let trail = [], status = '';
  function setChip(text, cls) { if (chip.textContent !== text) chip.textContent = text; chip.className = cls || ''; }
  function connect() {
    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/live');
    ws.onmessage = e => {
      const m = JSON.parse(e.data);
      if (m.type === 'status') status = m.msg;
      if (m.type !== 'point') return;
      if (m.ok) { trail.push([m.x, m.y]); if (trail.length > 30) trail.shift(); setChip('Tracking', 'ok'); }
      else setChip('No hand / not sure', 'warn');
      info.textContent = `${m.fps.toFixed(0)} fps${m.ok ? ' · confidence ' + m.c.toFixed(2) : ''} · ${status}`;
    };
    ws.onclose = () => { setChip('Disconnected'); setTimeout(connect, 1000); };
  }
  function draw() {
    g.clearRect(0, 0, c.width, c.height);
    trail.forEach(([x, y], i) => { g.fillStyle = `rgba(80,200,140,${(i + 1) / trail.length})`; g.beginPath(); g.arc(x * c.width, y * c.height, 4 + i / 6, 0, 7); g.fill(); });
    requestAnimationFrame(draw);
  }
  connect(); draw();
</script>
</body>
</html>
